[project]
name = "lead-scoring-backend"
version = "0.1.0"
description = "Asynchronous B2B lead scoring with an interactive dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "celery[redis]>=5.4,<6.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "redis>=5.2,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.data-files]
"share/lead-scoring" = ["Leadscorefrontend/lead-scoring-prioritisation-system.html"]
